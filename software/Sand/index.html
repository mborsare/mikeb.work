<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>mikeb.work/timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    @font-face {
      font-family: ComicMono;
      src: url("./fonts/ComicMono-Regular.woff") format("woff");
      font-display: swap;
    }

    /* Sun-faded fluorescent paper, with warm near-black ink. */
    :root {
      color-scheme: light;
      --panel: #e8dfbd;
      --border: #a39774;
      --text: #29281f;
      --quiet: #615b45;
      --grip: #807655;
      --card: #f3ebce;
      --label: #57523e;
      --label-on-light: #d9d0ac;
      --logo-ink: color-mix(in srgb, var(--panel) 75%, var(--text));
      --dialog-overlay: rgb(38 33 22 / 0.35);
      --dialog-shadow: rgb(38 33 22 / 0.2);
    }

    :root[data-theme="amber"] {
      --panel: #e2ef54; --card: #eff779; --border: #929d32;
      --text: #282c19; --quiet: #555d2a; --grip: #75803c;
      --label: #4b5326; --label-on-light: #dce977;
    }

    :root[data-theme="moss"] {
      --panel: #8ce4ae; --card: #adf0c5; --border: #529467;
      --text: #203329; --quiet: #395f47; --grip: #538764;
      --label: #36573f; --label-on-light: #a4dcb7;
    }

    :root[data-theme="ocean"] {
      --panel: #ff9b57; --card: #ffb67e; --border: #b66b38;
      --text: #3b281d; --quiet: #75482e; --grip: #9a5c35;
      --label: #68402a; --label-on-light: #efb284;
    }

    :root[data-theme="plum"] {
      --panel: #c4a0e4; --card: #d8b9f0; --border: #8868a4;
      --text: #30233d; --quiet: #604475; --grip: #7d5d96;
      --label: #553b69; --label-on-light: #cdb0e4;
    }

    :root[data-theme="rose"] {
      --panel: #ff83b6; --card: #ffa4ca; --border: #b4537d;
      --text: #3c2330; --quiet: #783c58; --grip: #9b5276;
      --label: #6b354f; --label-on-light: #efa6c5;
    }

    :root[data-theme="system"] {
      color-scheme: light dark;
      --panel: #ececec; --card: #fafafa; --border: #c8c8c8;
      --text: #202020; --quiet: #606060; --grip: #808080;
      --label: #505050; --label-on-light: #d4d4d4;
      --dialog-overlay: rgb(0 0 0 / 0.3);
      --dialog-shadow: rgb(0 0 0 / 0.18);
    }

    @media (prefers-color-scheme: dark) {
      :root[data-theme="system"] {
        --panel: #181818; --card: #252525; --border: #101010;
        --text: #efefef; --quiet: #aaa; --grip: #888;
        --label: #bdbdbd; --label-on-light: #555;
        --dialog-overlay: rgb(0 0 0 / 0.6);
        --dialog-shadow: rgb(0 0 0 / 0.35);
      }
    }

    :root[data-theme="custom"] {
      --panel: var(--custom-color, #e8dfbd);
      --text: var(--custom-ink, #29281f);
      --card: color-mix(in srgb, var(--panel) 90%, var(--text));
      --border: color-mix(in srgb, var(--panel) 65%, var(--text));
      --quiet: color-mix(in srgb, var(--panel) 25%, var(--text));
      --grip: color-mix(in srgb, var(--panel) 50%, var(--text));
      --label: var(--quiet);
      --label-on-light: var(--panel);
    }

    html,
    body {
      height: 100%;
      color: var(--text);
      font-family: ComicMono, monospace;
      margin: 0;
      background: var(--panel);
      overflow: hidden;
    }

    .timer {
      display: flex;
      flex-direction: column;
      height: 100vh;
      box-sizing: border-box;
      padding: 1.25rem;
      background: var(--panel);
      position: relative;
      overflow: hidden;
    }

    .grab-ring {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
    }

    .grab-ring span {
      position: absolute;
      display: flex;
      -webkit-app-region: drag;
      user-select: none;
      cursor: grab;
      pointer-events: auto;
    }

    .grab-ring span:active {
      cursor: grabbing;
    }

    .grab-ring .top,
    .grab-ring .bottom {
      right: 0;
      left: 0;
      height: 12px;
    }

    .grab-ring .top {
      top: 0;
    }

    /* Visible window grip: the whole edge remains draggable, with a tactile
       cluster of nubs marking the easiest place to grab it. */
    .grab-ring .top::after,
    .grab-ring .bottom::after {
      content: "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::";
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      left: 50%;
      width: 100%;
      height: 12px;
      transform: translateX(-50%);
      overflow: hidden;
      color: var(--grip);
      font: 700 12px/12px ComicMono, monospace;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .grab-ring .top::after {
      top: 0;
    }

    .grab-ring .bottom::after {
      bottom: 0;
    }

    .grab-ring .left::after,
    .grab-ring .right::after {
      content: "::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::::";
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      top: 50%;
      width: 12px;
      height: 100%;
      transform: translateY(-50%);
      overflow: hidden;
      color: var(--grip);
      font: 700 12px/12px ComicMono, monospace;
      letter-spacing: 0;
      writing-mode: vertical-rl;
      white-space: nowrap;
    }

    .grab-ring .left::after {
      left: 0.15rem;
    }

    .grab-ring .right::after {
      right: 0.15rem;
    }

    .grab-ring .bottom {
      bottom: 0;
    }

    .grab-ring .left,
    .grab-ring .right {
      top: 12px;
      bottom: 12px;
      width: 12px;
    }

    .grab-ring .left {
      left: 0;
    }

    .grab-ring .right {
      right: 0;
    }

    #timer-list {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      /* Keeps drag outlines inside the scroll clip, including on the first
         and last cards. */
      padding: 4px;
      box-sizing: border-box;
      background: transparent;
      overflow-y: auto;
      overflow-x: hidden;
      min-height: 0;
      scrollbar-width: none;
    }

    #timer-list::-webkit-scrollbar {
      display: none;
    }

    .timer-unit {
      --timer-surface: var(--card);
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-height: 110px;
      flex: 1 0 130px;
      background: var(--timer-surface);
      border-radius: 0.75rem;
      padding: 0.5rem 1rem;
      box-sizing: border-box;
      overflow: hidden;
      container-type: size;
    }

    /* Count-up timers are the active, open-ended mode. Give them a light
       surface so they are immediately distinct from countdowns. */
    .timer-unit.counting-up {
      --focus-ring: var(--panel);
      --timer-surface: var(--text);
      background: var(--timer-surface);
    }

    .timer-unit.counting-up .command {
      color: var(--panel);
    }

    .timer-unit.counting-up .timer-label {
      color: var(--label-on-light);
    }

    .timer-unit.counting-up .running-render,
    .timer-unit.counting-up .remove {
      color: var(--label-on-light);
    }

    .timer-unit.counting-up .pause {
      color: var(--panel);
    }

    .timer-unit.counting-up .timer-label:hover,
    .timer-unit.counting-up .timer-label:focus,
    .timer-unit.counting-up .remove:hover,
    .timer-unit.counting-up .remove:focus-visible {
      color: var(--panel);
    }

    .timer-label {
      grid-column: 1;
      grid-row: 1;
      width: 100%;
      box-sizing: border-box;
      padding: 0 0 0.15rem;
      border: 0;
      border-bottom: 1px solid transparent;
      outline: 0;
      background: transparent;
      color: var(--label);
      opacity: var(--timer-label-opacity, 1);
      font: inherit;
      font-size: 0.9rem;
      line-height: 1.25;
      text-overflow: ellipsis;
      transition: color 120ms ease, border-color 120ms ease, opacity 300ms ease;
    }

    .timer-label::placeholder {
      color: var(--grip);
      opacity: 1;
    }

    .timer-label:hover,
    .timer-label:focus {
      color: var(--text);
    }

    .timer-label::selection {
      color: var(--panel);
      background: var(--text);
    }

    .command {
      grid-column: 1 / -1;
      grid-row: 2;
      align-self: center;
      width: 100%;
      box-sizing: border-box;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      appearance: none;
      /* Scale to this card, rather than the whole window, so several timers
         cannot make the editable value overflow its own card. */
      font-size: clamp(28px, min(17vw, 50cqh), 500px);
      line-height: 1;
      text-align: center;
      transition: opacity 150ms ease;
    }

    .timer-unit.paused .command {
      opacity: 0.45;
    }

    .command::selection {
      color: var(--panel);
      background: var(--text);
    }

    .input-hints {
      grid-column: 1 / -1;
      grid-row: 3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 1.75rem;
      margin: 0.2rem 0.5rem 0.2rem;
      pointer-events: none;
      opacity: 0;
      transition: opacity 120ms ease;
    }

    .timer-unit:focus-within .input-hints,
    .timer-unit.running .input-hints,
    .timer-unit.paused .input-hints {
      opacity: 1;
      pointer-events: auto;
    }

    .intent-options,
    .commit-hint,
    .running-hint {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .intent-options[hidden],
    .commit-hint[hidden],
    .running-hint[hidden] {
      display: none;
    }

    .hint-chip,
    .enter-chip {
      border: 0;
      background: var(--border);
      border-radius: 0.2rem;
      outline: 0;
      padding: 0.2rem 0.4rem;
      color: var(--quiet);
      font: inherit;
      font-size: 0.8rem;
      line-height: 1.2;
    }

    .hint-chip {
      cursor: pointer;
      transition: color 120ms ease;
    }

    .hint-chip:hover,
    .hint-chip:focus-visible {
      color: var(--text);
    }

    .hint-or {
      color: var(--quiet);
      font-size: 0.75rem;
      opacity: 0.55;
      user-select: none;
    }

    .input-render,
    .running-render {
      color: var(--quiet);
      font-size: 0.8rem;
      line-height: 1.2;
      white-space: nowrap;
    }

    .enter-chip {
      color: var(--text);
      user-select: none;
      white-space: nowrap;
      cursor: pointer;
    }

    .pause {
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.8rem;
      line-height: 1.2;
      white-space: nowrap;
      text-decoration: underline;
      text-underline-offset: 0.15em;
      cursor: pointer;
    }

    .remove {
      grid-column: 2;
      grid-row: 1;
      align-self: start;
      padding: 0;
      border: 0;
      background: transparent;
      color: var(--quiet);
      font: inherit;
      font-size: 0.8rem;
      opacity: 0;
      transition: opacity 120ms ease, color 120ms ease;
      cursor: pointer;
    }

    .remove:hover,
    .remove:focus-visible {
      color: var(--text);
    }

    .timer-unit:hover .remove,
    .remove:focus-visible {
      opacity: 1;
    }

    .timer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      margin-top: 0.4rem;
      gap: 0.4rem 0.75rem;
      flex-wrap: wrap;
    }

    .timer-create-options,
    .theme-picker {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .timer-create-options {
      margin-left: auto;
    }

    .card-underprint {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      margin: 0;
      color: var(--quiet);
      font: 6px/1 ComicMono, Menlo, monospace;
      letter-spacing: 0;
      white-space: pre;
      user-select: none;
      pointer-events: none;
    }

    .action-logo {
      display: none;
      flex: none;
      margin: 0 1rem 0 0;
      padding-left: 12px;
      color: var(--logo-ink);
      font: 6px/1 ComicMono, Menlo, monospace;
      letter-spacing: 0;
      white-space: pre;
      user-select: none;
      pointer-events: none;
    }

    @media (min-width: 660px) {
      .action-logo {
        display: block;
      }
    }

    .theme-swatch {
      position: relative;
      width: 11px;
      height: 11px;
      border: 0;
      border-radius: 50%;
      padding: 0;
      background: var(--swatch);
      cursor: pointer;
      flex: none;
      outline: 1px solid transparent;
      outline-offset: 3px;
      transition: outline-color 120ms ease;
    }

    /* Fill the gaps and add generous vertical reach without moving the dots. */
    .theme-swatch::before {
      content: "";
      position: absolute;
      inset: -17px -3.5px;
    }

    .theme-swatch[aria-pressed="true"],
    .theme-swatch:focus-visible {
      outline-color: var(--text);
    }

    .theme-swatch[data-theme="custom"] {
      background: var(--custom-color, conic-gradient(#ff83b6, #e2ef54, #8ce4ae, #c4a0e4, #ff83b6));
      color: var(--custom-ink, #29281f);
      font: 10px/11px ComicMono, monospace;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: 0s !important;
        animation-duration: 0s !important;
      }
    }

    /* Tiny mode is a glanceable, read-only index of every timer. The cards
       deliberately become plain inline text so a comma is the only separator
       the eye needs to scan the list. */
    .timer.tiny-mode {
      padding: 0.75rem 1rem;
      justify-content: center;
      align-items: center;
    }

    .timer.tiny-mode header,
    .timer.tiny-mode .timer-actions,
    .timer.tiny-mode .input-hints,
    .timer.tiny-mode .pause,
    .timer.tiny-mode .remove {
      display: none;
    }

    .timer.tiny-mode #timer-list {
      display: flex;
      flex: 0 0 auto;
      flex-direction: row;
      flex-wrap: wrap;
      justify-content: center;
      align-items: baseline;
      gap: 0.35rem 0.5rem;
      min-height: 0;
      width: 100%;
      overflow: hidden;
    }

    .timer.tiny-mode .timer-unit {
      display: inline-block;
      box-sizing: border-box;
      flex: none;
      /* Regular cards are size-contained so their command font can use cqh.
         In tiny mode the card must instead derive its size from the summary;
         size containment would make this inline box 0 × 0. */
      container-type: normal;
      min-height: 0;
      max-width: 100%;
      width: auto;
      margin: 0;
      padding: 0 0 0.15rem;
      border-bottom: 1px solid currentColor;
      border-radius: 0;
      background: transparent;
      color: var(--quiet);
      font-size: 0.8rem;
      line-height: 1.25;
      opacity: 1;
      cursor: pointer;
      transition: color 150ms ease, opacity 150ms ease;
      vertical-align: baseline;
    }

    .timer.tiny-mode .timer-unit:not(:first-child)::before {
      content: "";
    }

    .timer.tiny-mode .timer-unit::after {
      display: none;
    }

    .timer.tiny-mode .timer-unit:hover,
    .timer.tiny-mode .timer-unit:focus {
      color: var(--text);
    }

    .tiny-summary {
      display: none;
    }

    .timer.tiny-mode .timer-label,
    .timer.tiny-mode .command {
      display: none;
    }

    .timer.tiny-mode .tiny-summary {
      /* The regular timer card is a column flex container. Make the only
         remaining child a real flex item so it retains an intrinsic size
         after the editable controls are hidden. */
      display: block;
      flex: 0 1 auto;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #add,
    #tiny-mode,
    #seconds-toggle,
    #clock-toggle {
      padding: 0.2rem 0.4rem;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--quiet);
      font: inherit;
      font-size: 1.25rem;
      cursor: pointer;
      transition: color 120ms ease;
    }

    #tiny-mode,
    #seconds-toggle,
    #clock-toggle {
      font-size: 0.8rem;
    }

    #add:hover,
    #add:focus-visible,
    #tiny-mode:hover,
    #tiny-mode:focus-visible,
    #seconds-toggle:hover,
    #seconds-toggle:focus-visible,
    #clock-toggle:hover,
    #clock-toggle:focus-visible {
      color: var(--text);
    }

    .timer-display-options {
      display: flex;
      flex: 1;
      min-width: 0;
      align-items: center;
      gap: 7px;
    }

    .seconds-control {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--quiet);
      font-size: 0.8rem;
      white-space: nowrap;
    }

    #tiny-mode {
      display: inline-flex;
      flex: none;
      padding: 0.2rem;
    }

    #tiny-mode svg {
      width: 16px;
      height: 16px;
    }

    #tiny-mode .expand-icon,
    #tiny-mode[aria-pressed="true"] .shrink-icon {
      display: none;
    }

    #tiny-mode[aria-pressed="true"] .expand-icon {
      display: block;
    }

    .timer.tiny-mode .timer-actions,
    .timer.tiny-mode .timer-display-options {
      display: contents;
    }

    .timer.tiny-mode .seconds-control,
    .timer.tiny-mode .timer-create-options,
    .timer.tiny-mode .action-logo {
      display: none;
    }

    .timer.tiny-mode {
      padding-left: 3rem;
      padding-right: 1rem;
    }

    .timer.tiny-mode #tiny-mode {
      position: absolute;
      left: 1.25rem;
      top: 50%;
      transform: translateY(-50%);
    }

    .timer-display-options button {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .timer-create-options {
      flex: none;
    }

    @media (max-width: 420px) {
      .timer-actions {
        gap: 0.4rem;
        flex-wrap: nowrap;
      }

      .timer-create-options,
      .theme-picker {
        gap: 5px;
      }
    }

    .timer-unit[draggable="true"] {
      cursor: grab;
    }

    /* A small raised-dot grip makes the timer feel like a movable physical pad. */
    .timer-unit[draggable="true"]::after {
      content: "::::";
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      right: 0.5rem;
      top: 50%;
      z-index: 4;
      width: 12px;
      height: auto;
      transform: translateY(-50%);
      color: var(--grip);
      font: 700 12px/12px ComicMono, monospace;
      letter-spacing: 0;
      writing-mode: vertical-rl;
      pointer-events: none;
    }

    .timer-unit.dragging {
      background: transparent;
    }

    .timer-unit.dragging > :not(.card-underprint) {
      visibility: hidden;
    }

    .timer-unit.dragging .card-underprint {
      display: block;
    }

    .timer-unit.dragging::after {
      display: none;
    }

    .timer-unit.drop-target {
      box-shadow: 0 0 0 2px var(--text);
    }

    /* Dropping near a card edge (or in a gap) changes its order instead of
       combining timers. The line marks exactly where it will land. */
    .timer-unit.drop-before {
      overflow: visible;
    }

    .timer-unit.drop-after {
      overflow: visible;
    }

    .timer-unit.drop-before::before,
    .timer-unit.drop-after::before {
      content: "";
      position: absolute;
      right: 0;
      left: 0;
      z-index: 5;
      height: 6px;
      border-radius: 999px;
      background: var(--text);
      pointer-events: none;
    }

    .timer-unit.drop-before::before {
      top: -8px;
    }

    .timer-unit.drop-after::before {
      bottom: -8px;
    }

    .merge-dialog {
      position: fixed;
      inset: 0;
      z-index: 200;
      display: grid;
      place-items: center;
      padding: 1.25rem;
      box-sizing: border-box;
      background: var(--dialog-overlay);
    }

    .merge-dialog[hidden] {
      display: none;
    }

    .merge-dialog__panel {
      width: min(100%, 22rem);
      padding: 1rem;
      border: 1px solid var(--label-on-light);
      border-radius: 0.75rem;
      background: var(--card);
      box-shadow: 0 1rem 3rem var(--dialog-shadow);
    }

    .merge-dialog__message {
      margin: 0 0 1rem;
      color: var(--text);
      font-size: 0.9rem;
      line-height: 1.45;
    }

    .merge-dialog__actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.5rem;
    }

    .merge-dialog button {
      border: 0;
      border-radius: 0.25rem;
      padding: 0.4rem 0.6rem;
      background: var(--border);
      color: var(--quiet);
      font: inherit;
      font-size: 0.8rem;
      cursor: pointer;
    }

    .merge-dialog button:hover,
    .merge-dialog button:focus-visible {
      color: var(--text);
    }

    /* Use the swatches' focus ring for every keyboard target. */
    :root :focus-visible {
      outline: 2px solid var(--focus-ring, var(--text)) !important;
      outline-offset: 3px !important;
      border-radius: 4px !important;
    }

    .clock-panel {
      flex: none;
      width: 12ch;
      text-align: center;
      padding: 0.25rem 0.4rem;
      border-radius: 3px;
      background: color-mix(in srgb, var(--panel) 94%, var(--text));
      color: var(--quiet);
      font: inherit;
      font-size: 0.8rem;
      line-height: 1.2;
      font-variant-numeric: tabular-nums;
    }

    #clock-toggle,
    #seconds-toggle {
      display: inline-flex;
      align-items: center;
      flex: none;
      width: 28px;
      height: 16px;
      padding: 2px;
      border: 1px solid var(--quiet);
      border-radius: 4px;
      background: transparent;
      transition: none;
    }

    #clock-toggle::before,
    #seconds-toggle::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 2px;
      background: var(--quiet);
    }

    #clock-toggle[aria-checked="true"],
    #seconds-toggle[aria-checked="true"] {
      background: var(--quiet);
    }

    #clock-toggle[aria-checked="true"]::before,
    #seconds-toggle[aria-checked="true"]::before {
      background: var(--panel);
      transform: translateX(12px);
    }

    .clock-panel[hidden],
    .timer.tiny-mode .clock-panel {
      display: none;
    }

    .clock-time {
      display: block;
      text-align: center;
      line-height: 1.2;
      white-space: nowrap;
      letter-spacing: 0.04em;
    }

    .clock-off {
      opacity: 0.45;
      white-space: nowrap;
    }

    .clock-time[hidden],
    .clock-off[hidden] {
      display: none;
    }

    .merge-undo {
      position: absolute;
      bottom: 4.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      max-width: calc(100% - 3rem);
      box-sizing: border-box;
      padding: 0.5rem 0.65rem;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--panel);
      color: var(--quiet);
      font-size: 0.75rem;
    }

    .merge-undo[hidden] { display: none; }

    .merge-undo button {
      border: 0;
      padding: 0.2rem;
      background: transparent;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }

    #merge-undo-countdown { opacity: 0.55; }
  </style>
  <script>
    try {
      document.documentElement.dataset.theme = localStorage.getItem("sandTheme") || "graphite";
    } catch { }
  </script>
</head>

<body>
  <div class="grab-ring" aria-hidden="true">
    <span class="top"></span>
    <span class="right"></span>
    <span class="bottom"></span>
    <span class="left"></span>
  </div>
  <div class="merge-dialog" id="merge-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="merge-message">
    <div class="merge-dialog__panel">
      <p class="merge-dialog__message" id="merge-message"></p>
      <div class="merge-dialog__actions">
        <button type="button" data-merge-action="cancel">cancel</button>
        <button type="button" data-merge-action="subtract">subtract</button>
        <button type="button" data-merge-action="add">add</button>
      </div>
    </div>
  </div>
  <main class="timer">
    <div id="timer-list"></div>
    <div class="merge-undo" id="merge-undo" hidden>
      <span role="status">timers combined</span>
      <button type="button" id="merge-undo-button">undo <span id="merge-undo-countdown" aria-hidden="true"></span></button>
      <button type="button" id="merge-undo-dismiss" aria-label="Dismiss undo" title="Dismiss">×</button>
    </div>
    <div class="timer-actions">
      <div class="timer-display-options">
        <button id="tiny-mode" type="button" aria-label="Enter tiny mode" title="Shrink" aria-pressed="false">
          <svg class="shrink-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 1l5 5M6 2v4H2M15 15l-5-5M10 14v-4h4"/></svg>
          <svg class="expand-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6L1 1M1 5V1h4M10 10l5 5M15 11v4h-4"/></svg>
        </button>
        <pre class="action-logo" aria-hidden="true">▄▖     ▌
▚ ▀▌▛▌▛▌
▄▌█▌▌▌▙▌</pre>
        <label class="seconds-control">seconds <button id="seconds-toggle" type="button" role="switch" aria-label="Show seconds" title="Show seconds" aria-checked="false"></button></label>
      </div>
      <div class="timer-create-options">
        <div class="theme-picker" role="group" aria-label="Interface color">
          <button type="button" class="theme-swatch" data-theme="system" style="--swatch: linear-gradient(90deg, #eee 50%, #202020 50%)" aria-label="Follow macOS appearance" title="System — follows macOS light or dark mode" aria-pressed="false"></button>
          <button type="button" class="theme-swatch" data-theme="custom" aria-label="Choose custom color" title="Choose custom color" aria-pressed="false">+</button>
          <input id="custom-color" type="color" value="#e8dfbd" tabindex="-1" aria-label="Custom interface color" hidden>
          <button type="button" class="theme-swatch" data-theme="graphite" style="--swatch: #e8dfbd" aria-label="Old paper" title="Old paper" aria-pressed="true"></button>
          <button type="button" class="theme-swatch" data-theme="amber" style="--swatch: #e2ef54" aria-label="Acid yellow" title="Acid yellow" aria-pressed="false"></button>
          <button type="button" class="theme-swatch" data-theme="moss" style="--swatch: #8ce4ae" aria-label="Faded mint" title="Faded mint" aria-pressed="false"></button>
          <button type="button" class="theme-swatch" data-theme="ocean" style="--swatch: #ff9b57" aria-label="Safety orange" title="Safety orange" aria-pressed="false"></button>
          <button type="button" class="theme-swatch" data-theme="plum" style="--swatch: #c4a0e4" aria-label="Ditto lilac" title="Ditto lilac" aria-pressed="false"></button>
          <button type="button" class="theme-swatch" data-theme="rose" style="--swatch: #ff83b6" aria-label="Flyer pink" title="Flyer pink" aria-pressed="false"></button>
        </div>
        <div class="clock-panel" id="clock-panel" aria-label="Current time" hidden>
          <time class="clock-time" id="clock-time"></time>
          <span class="clock-off" hidden>clock hidden</span>
        </div>
        <button id="clock-toggle" type="button" role="switch" aria-label="Clock" title="Clock" aria-checked="true" aria-controls="clock-panel"></button>
        <button id="add" type="button" aria-label="Add timer">＋</button>
      </div>
    </div>
  </main>

  <template id="timer-template">
    <section class="timer-unit">
      <pre class="card-underprint" aria-hidden="true">▄▖     ▌
▚ ▀▌▛▌▛▌
▄▌█▌▌▌▙▌</pre>
      <input class="timer-label" aria-label="Timer label" placeholder="Label" autocomplete="off" spellcheck="false">
      <input class="command" aria-label="Timer" autocomplete="off" spellcheck="false">
      <span class="tiny-summary"></span>
      <div class="input-hints">
        <div class="intent-options">
          <button type="button" class="hint-chip" data-value="45m">for 45m</button>
          <span class="hint-or">or</span>
          <button type="button" class="hint-chip" data-value="9:00pm">until 9:00pm</button>
        </div>
        <div class="commit-hint" hidden>
          <span class="input-render"></span>
          <span class="enter-chip">press enter ↵</span>
        </div>
        <div class="running-hint" hidden>
          <span class="running-render"></span>
          <button type="button" class="pause" hidden>pause</button>
        </div>
      </div>
      <button class="remove" aria-label="Delete timer">remove</button>
    </section>
  </template>

  <script>
    const timerList = document.querySelector("#timer-list");
    const timerTemplate = document.querySelector("#timer-template");
    const timerActions = document.querySelector(".timer-actions");
    const addButton = document.querySelector("#add");
    const tinyModeButton = document.querySelector("#tiny-mode");
    const secondsToggleButton = document.querySelector("#seconds-toggle");
    const clockToggleButton = document.querySelector("#clock-toggle");
    const clockPanel = document.querySelector("#clock-panel");
    const clockTime = document.querySelector("#clock-time");
    let clockRefreshTimer = null;
    let clockHour12;
    const shell = document.querySelector(".timer");
    const mergeDialog = document.querySelector("#merge-dialog");
    const mergeMessage = document.querySelector("#merge-message");
    const mergeUndoBanner = document.querySelector("#merge-undo");
    const mergeUndoButton = document.querySelector("#merge-undo-button");
    const mergeUndoDismiss = document.querySelector("#merge-undo-dismiss");
    const mergeUndoCountdown = document.querySelector("#merge-undo-countdown");
    let pendingMergeUndo = null;
    let mergeUndoTimer = null;
    let mergeRequest = null;
    let mergeRefreshTimer = null;
    let tinyMode = false;
    let modeTransition = false;
    let fullModeHeight = null;
    let fullModeScroll = 0;
    let lastWindowWidth = window.innerWidth;
    let tinyResizeFrame = null;
    let showSeconds = false;

    const themeSwatches = [...document.querySelectorAll(".theme-swatch")];
    const customColorPicker = document.querySelector("#custom-color");

    function applyCustomColor(color) {
      if (!/^#[0-9a-f]{6}$/i.test(color)) return;
      const channels = color.slice(1).match(/../g).map(channel => {
        const value = parseInt(channel, 16) / 255;
        return value <= 0.04045 ? value / 12.92 : ((value + 0.055) / 1.055) ** 2.4;
      });
      const luminance = channels[0] * 0.2126 + channels[1] * 0.7152 + channels[2] * 0.0722;
      document.documentElement.style.setProperty("--custom-color", color);
      document.documentElement.style.setProperty("--custom-ink", luminance > 0.179 ? "#161616" : "#fafafa");
      customColorPicker.value = color;
      try { localStorage.setItem("sandCustomColor", color); } catch { }
    }

    try {
      const savedColor = localStorage.getItem("sandCustomColor");
      if (savedColor) applyCustomColor(savedColor);
    } catch { }

    function selectTheme(theme) {
      if (!themeSwatches.some(button => button.dataset.theme === theme)) theme = "graphite";
      document.documentElement.dataset.theme = theme;
      themeSwatches.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.theme === theme)));
      try { localStorage.setItem("sandTheme", theme); } catch { }
    }
    themeSwatches.forEach(button => {
      button.addEventListener("click", () => {
        if (button.dataset.theme === "custom") {
          applyCustomColor(customColorPicker.value);
          customColorPicker.click();
        }
        selectTheme(button.dataset.theme);
      });
    });
    customColorPicker.addEventListener("input", () => {
      applyCustomColor(customColorPicker.value);
      selectTheme("custom");
    });
    selectTheme(document.documentElement.dataset.theme);

    try {
      showSeconds = localStorage.getItem("showSeconds") === "true";
    } catch { }

    function formatTime(totalSeconds, includeSeconds = true) {
      const hours = Math.floor(totalSeconds / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      return includeSeconds
        ? `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`
        : `${hours}:${String(minutes).padStart(2, "0")}`;
    }

    function formatClockTime(timestamp) {
      const date = new Date(timestamp);
      let hours = date.getHours();
      const minutes = date.getMinutes();
      const meridiem = hours >= 12 ? "pm" : "am";

      hours = hours % 12;
      hours = hours ? hours : 12;

      return `${hours}:${String(minutes).padStart(2, "0")} ${meridiem.toUpperCase()}`;
    }

    function isCountUpCommand(value) {
      return value.trim() === "+";
    }

    function normalizeCommand(value) {
      const input = value
        .trim()
        .toLowerCase()
        .replaceAll(" ", "")
        .replaceAll(";", ":")
        .replace(/^(@?)(\d{2})(\d{2})(?=(?:am|pm)?(?:-|$))/, "$1$2:$3");

      // Two-digit hours (with or without a colon) mean a time of day.
      // Keep short duration inputs such as 30 and 1:30 working as before.
      return /^\d{2}:\d{2}(?=(?:am|pm)?(?:-|$))/.test(input) ? `@${input}` : input;
    }

    function parseCommand(value) {
      const input = normalizeCommand(value);

      if (!input) return null;

      if (input.startsWith("in")) {
        const match = input.match(/^in(\d+(?:\.\d+)?)$/);
        if (!match) return null;
        const seconds = Math.round(Number(match[1]) * 60);
        return Number.isSafeInteger(seconds) ? seconds : null;
      }

      if (input.startsWith(".")) {
        const secondsPart = input.slice(1);
        if (/^\d+$/.test(secondsPart)) return Number(secondsPart);
        return null;
      }

      if (input.startsWith("@")) {
        let timeInput = input.slice(1);
        let minuteOffset = 0;
        const offsetMatch = timeInput.match(/^(.*?)-(\d+)(?:m|min|mins|minute|minutes)?$/);

        if (offsetMatch) {
          timeInput = offsetMatch[1];
          minuteOffset = Number(offsetMatch[2]);
          if (!Number.isSafeInteger(minuteOffset)) return null;
        }

        const meridiemMatch = timeInput.match(/^(\d{1,2}):(\d{2})(am|pm)$/);

        if (meridiemMatch) {
          let hours = Number(meridiemMatch[1]);
          const minutes = Number(meridiemMatch[2]);
          const meridiem = meridiemMatch[3];

          if (hours < 1 || hours > 12 || minutes > 59) return null;
          if (meridiem === "pm" && hours !== 12) hours += 12;
          if (meridiem === "am" && hours === 12) hours = 0;

          const now = new Date();
          const target = new Date();
          target.setHours(hours, minutes, 0, 0);
          target.setMinutes(target.getMinutes() - minuteOffset);

          if (target <= now) target.setDate(target.getDate() + 1);
          return Math.ceil((target - now) / 1000);
        }

        const match = timeInput.match(/^(\d{1,2}):(\d{2})$/);
        if (!match) return null;

        const hours = Number(match[1]);
        const minutes = Number(match[2]);
        if (hours > 23 || minutes > 59) return null;

        const now = new Date();
        const target = new Date();
        target.setHours(hours, minutes, 0, 0);
        target.setMinutes(target.getMinutes() - minuteOffset);

        if (target <= now) target.setDate(target.getDate() + 1);
        return Math.ceil((target - now) / 1000);
      }

      const meridiemMatch = input.match(/^(\d{1,2}):(\d{2})(am|pm)$/);
      if (meridiemMatch) {
        let hours = Number(meridiemMatch[1]);
        const minutes = Number(meridiemMatch[2]);
        const meridiem = meridiemMatch[3];

        if (hours < 1 || hours > 12 || minutes > 59) return null;
        if (meridiem === "pm" && hours !== 12) hours += 12;
        if (meridiem === "am" && hours === 12) hours = 0;

        const now = new Date();
        const target = new Date();
        target.setHours(hours, minutes, 0, 0);

        if (target <= now) target.setDate(target.getDate() + 1);
        return Math.ceil((target - now) / 1000);
      }

      const unitMatch = input.match(/^(\d+(?:\.\d+)?)(h|m|s)$/);
      if (unitMatch) {
        const amount = Number(unitMatch[1]);
        const unit = unitMatch[2];

        if (unit === "h") return Math.round(amount * 3600);
        if (unit === "m") return Math.round(amount * 60);
        return Math.round(amount);
      }

      if (/^\d+$/.test(input)) {
        return Number(input) * 60;
      }

      const parts = input.split(":").map(Number);
      if (parts.some(Number.isNaN) || parts.length < 2 || parts.length > 3) {
        return null;
      }

      if (parts.length === 2) {
        const [hours, minutes] = parts;
        if (minutes > 59) return null;
        return hours * 3600 + minutes * 60;
      }

      const [hours, minutes, seconds] = parts;
      if (minutes > 59 || seconds > 59) return null;
      return hours * 3600 + minutes * 60 + seconds;
    }

    function readTimer(state, now) {
      if (!state.running) return {
        seconds: state.remainingSeconds,
        countingUp: state.countingUp,
        endedAt: state.endedAt ?? null
      };
      const justEnded = !state.countingUp && now >= state.deadline;
      const countingUp = state.countingUp || justEnded;
      return {
        seconds: countingUp
          ? Math.max(0, Math.floor((now - state.deadline) / 1000))
          : Math.max(0, Math.ceil((state.deadline - now) / 1000)),
        countingUp,
        endedAt: justEnded ? state.deadline : (state.endedAt ?? null)
      };
    }

    function mergeTimerValues(source, target, action) {
      const labels = [target.label.trim(), source.label.trim()].filter(Boolean);
      return {
        seconds: action === "add"
          ? target.remainingSeconds + source.remainingSeconds
          : Math.max(0, target.remainingSeconds - source.remainingSeconds),
        label: labels.join(action === "add" ? " + " : " − ")
      };
    }

    function addTimer(initialMinutes = 0, autoStart = false, blank = false, landing = false) {
      const timer = timerTemplate.content.firstElementChild.cloneNode(true);

      if (blank) timer.classList.add("empty");
      if (landing) timer.classList.add("landing");

      const label = timer.querySelector(".timer-label");
      const command = timer.querySelector(".command");
      const tinySummary = timer.querySelector(".tiny-summary");
      const inputHints = timer.querySelector(".input-hints");
      const intentOptions = timer.querySelector(".intent-options");
      const commitHint = timer.querySelector(".commit-hint");
      const runningHint = timer.querySelector(".running-hint");
      const inputRender = timer.querySelector(".input-render");
      const runningRender = timer.querySelector(".running-render");
      const enterChip = timer.querySelector(".enter-chip");
      const pauseButton = timer.querySelector(".pause");
      const removeButton = timer.querySelector(".remove");

      let remainingSeconds = blank ? 0 : initialMinutes * 60;
      let initialSeconds = remainingSeconds;
      let endedAt = null;
      let disposableIfEmpty = blank;
      let running = false;
      let countingUp = false;
      let hasStarted = false;
      let deadline = 0;
      let timerId = null;

      timer.draggable = !blank;

      function clockTargetLabel(raw) {
        const input = normalizeCommand(raw);
        if (input.startsWith("@")) {
          const value = input.slice(1);
          if (/-\s*\d+\s*m?\s*$/.test(value)) {
            const seconds = parseCommand(raw);
            if (seconds !== null) return formatClockTime(Date.now() + seconds * 1000);
          }
          if (/^\d{1,2}:\d{2}(am|pm)$/.test(value)) {
            return value.replace(/(am|pm)$/i, match => ` ${match.toUpperCase()}`);
          }
          return value;
        }
        if (/^\d{1,2}:\d{2}(am|pm)$/.test(input)) {
          return input.replace(/(am|pm)$/i, match => ` ${match.toUpperCase()}`);
        }
        return null;
      }

      function updateInputAssist() {
        if (endedAt !== null) {
          intentOptions.hidden = true;
          commitHint.hidden = true;
          runningHint.hidden = false;
          runningRender.textContent = `ended at ${formatClockTime(endedAt)}`;
          return;
        }
        if (running) {
          intentOptions.hidden = true;
          commitHint.hidden = true;
          runningHint.hidden = false;
          runningRender.textContent = countingUp
            ? `started at ${formatClockTime(deadline)}`
            : `ends at ${formatClockTime(deadline)}`;
          return;
        }

        if (canResume()) {
          intentOptions.hidden = true;
          commitHint.hidden = true;
          runningHint.hidden = false;
          runningRender.textContent = "paused";
          return;
        }

        const raw = command.value.trim();
        if (!raw) {
          intentOptions.hidden = false;
          commitHint.hidden = true;
          runningHint.hidden = true;
          inputRender.textContent = "";
          return;
        }

        intentOptions.hidden = true;
        commitHint.hidden = false;
        runningHint.hidden = true;

        if (isCountUpCommand(raw)) {
          inputRender.textContent = "→ count up";
          return;
        }

        const seconds = parseCommand(raw);
        if (seconds === null || seconds <= 0) {
          inputRender.textContent = "";
          return;
        }

        const clockLabel = clockTargetLabel(raw);
        inputRender.textContent = clockLabel ? `→ until ${clockLabel}` : `→ ${formatTime(seconds, showSeconds)}`;
      }

      function render() {
        const includeSeconds = showSeconds || (countingUp ? remainingSeconds < 60 : remainingSeconds <= 60);
        command.value = formatTime(remainingSeconds, includeSeconds);
        const timerName = label.value.trim() || "untitled";
        tinySummary.textContent = `${timerName} ${command.value}`;
        const proximity = countingUp
          ? 1
          : 1 - Math.min(1, remainingSeconds / 3600);
        timer.style.setProperty("--timer-label-opacity", String(0.45 + proximity * 0.55));
        command.readOnly = running || tinyMode || endedAt !== null;
        pauseButton.hidden = endedAt === null && !running && !canResume();
        pauseButton.textContent = endedAt !== null ? "reset" : running ? "pause" : "resume";
        pauseButton.setAttribute("aria-label", endedAt !== null ? "Reset timer" : running ? "Pause timer" : "Resume timer");
        updateInputAssist();
      }

      function updateClock(now = Date.now()) {
        const reading = readTimer({ running, countingUp, deadline, remainingSeconds, endedAt }, now);
        if (endedAt === null && reading.endedAt !== null) document.title = "Overtime";
        remainingSeconds = reading.seconds;
        countingUp = reading.countingUp;
        endedAt = reading.endedAt;
        timer.classList.toggle("counting-up", countingUp);
      }

      function pause() {
        updateClock();

        running = false;
        timer.classList.remove("running");
        timer.classList.toggle("paused", hasStarted);
        clearTimeout(timerId);
        timerId = null;

        render();
        syncAddButton();
        persistTimerState();
      }

      function tick() {
        updateClock();
        render();
        persistTimerState();

        timerId = setTimeout(tick, 1000 - Date.now() % 1000 + 5);
      }

      function start(savedDeadline = null) {
        if (!countingUp && remainingSeconds <= 0) return;

        hasStarted = true;
        running = true;
        timer.classList.remove("paused");
        timer.classList.add("running");
        clearTimeout(timerId);
        const now = Date.now();
        deadline = Number.isFinite(savedDeadline) ? savedDeadline
          : endedAt !== null ? endedAt
          : countingUp ? now - remainingSeconds * 1000 : now + remainingSeconds * 1000;
        timerId = setTimeout(tick, 1000 - Date.now() % 1000 + 5);

        document.title = endedAt !== null ? "Overtime" : "Sand";
        render();
        syncAddButton();
        command.blur();
        persistTimerState();
      }

      function startFromInput() {
        endedAt = null;
        if (isCountUpCommand(command.value)) {
          remainingSeconds = 0;
          initialSeconds = 0;
          countingUp = true;
          disposableIfEmpty = false;

          timer.classList.remove("empty", "landing");
          timer.classList.add("counting-up");
          timer.draggable = true;
          updateDeleteButtons();
          start();
          return;
        }

        const seconds = parseCommand(command.value);
        if (seconds === null || seconds <= 0) {
          command.select();
          return;
        }

        remainingSeconds = seconds;
        initialSeconds = seconds;
        countingUp = false;
        disposableIfEmpty = false;

        timer.classList.remove("empty", "landing", "counting-up");
        timer.draggable = true;
        updateDeleteButtons();
        start();
      }

      function currentSeconds(now = Date.now()) {
        updateClock(now);
        return remainingSeconds;
      }

      function canResume() {
        return hasStarted && !timer.classList.contains("empty") && (countingUp || remainingSeconds > 0);
      }

      function setMergedSeconds(seconds, shouldRun, mergedLabel) {
        pause();
        endedAt = null;
        label.value = mergedLabel;
        remainingSeconds = Math.max(0, seconds);
        initialSeconds = remainingSeconds;
        countingUp = false;
        disposableIfEmpty = false;
        timer.classList.remove("empty", "landing", "counting-up");
        timer.draggable = true;
        render();
        updateDeleteButtons();
        if (shouldRun && remainingSeconds > 0) start();
        persistTimerState();
      }

      function reset() {
        clearTimeout(timerId);
        timerId = null;
        running = false;
        countingUp = false;
        endedAt = null;
        deadline = 0;
        remainingSeconds = initialSeconds;
        hasStarted = initialSeconds > 0;
        timer.classList.remove("running", "counting-up");
        timer.classList.toggle("paused", hasStarted);
        document.title = "Sand";
        render();
        syncAddButton();
        persistTimerState();
      }

      function snapshot(now = Date.now()) {
        const seconds = currentSeconds(now);
        return {
          label: label.value,
          remainingSeconds: seconds,
          initialSeconds,
          endedAt,
          running,
          countingUp,
          hasStarted,
          deadline,
          empty: timer.classList.contains("empty"),
          landing: timer.classList.contains("landing")
        };
      }

      function restore(state) {
        label.value = typeof state.label === "string" ? state.label : "";
        countingUp = Boolean(state.countingUp);
        endedAt = Number.isFinite(state.endedAt) ? state.endedAt : null;
        initialSeconds = Math.max(0, Number.isFinite(state.initialSeconds)
          ? state.initialSeconds : Number(state.remainingSeconds) || 0);
        hasStarted = Boolean(state.hasStarted || state.running);
        const isEmpty = Boolean(state.empty);
        disposableIfEmpty = isEmpty;
        timer.classList.toggle("empty", isEmpty);
        timer.classList.toggle("landing", Boolean(state.landing));
        timer.classList.toggle("counting-up", countingUp);
        timer.classList.toggle("paused", hasStarted && !state.running);
        timer.draggable = !isEmpty;

        remainingSeconds = Math.max(0, Number(state.remainingSeconds) || 0);
        if (state.running && Number.isFinite(state.deadline)) {
          deadline = state.deadline;
          running = true;
          updateClock();
          running = false;
        }

        render();
        if (isEmpty) {
          command.value = "";
          tinySummary.textContent = `${label.value.trim() || "untitled"} —`;
          updateInputAssist();
        }
        if (state.running && (countingUp || remainingSeconds > 0)) {
          start(Number.isFinite(state.deadline) ? state.deadline : null);
        }
      }

      function destroy() {
        clearTimeout(timerId);
        timer.remove();
      }

      timer.timerState = { currentSeconds, pause, reset, setMergedSeconds, destroy, snapshot, restore, render, isRunning: () => running };

      timer.addEventListener("click", event => {
        if (!tinyMode) return;
        event.preventDefault();
        leaveTinyMode(timer);
      });

      inputHints.querySelectorAll(".hint-chip").forEach(chip => {
        chip.addEventListener("mousedown", event => event.preventDefault());
        chip.addEventListener("click", () => {
          command.value = chip.dataset.value;
          updateInputAssist();
          requestAnimationFrame(() => {
            command.focus();
            command.select();
          });
        });
      });

      command.addEventListener("focus", () => {
        if (endedAt !== null) return;
        if (running) pause();
        requestAnimationFrame(() => {
          command.select();
          updateInputAssist();
        });
      });

      command.addEventListener("input", () => {
        updateInputAssist();
        syncAddButton();
      });

      function discardDraftIfEmpty(nextTarget) {
        if (!disposableIfEmpty || command.value.trim() || label.value.trim()) return false;
        if (nextTarget && timer.contains(nextTarget)) return false;

        if (timerList.children.length > 1) {
          clearTimeout(timerId);
          timer.remove();
          updateDeleteButtons();
          return true;
        }

        return false;
      }

      command.addEventListener("blur", event => {
        if (endedAt !== null) return;
        if (running) return;

        if (discardDraftIfEmpty(event.relatedTarget)) return;

        if (!timer.classList.contains("empty") && command.value.trim()) {
          startFromInput();
        }
      });

      label.addEventListener("blur", event => {
        discardDraftIfEmpty(event.relatedTarget);
      });

      label.addEventListener("input", () => {
        const timerName = label.value.trim() || "untitled";
        tinySummary.textContent = `${timerName} ${command.value}`;
        updateDeleteButtons();
        persistTimerState();
      });

      // A label is optional, but it is the natural first field for a new
      // timer. Escape lets someone skip it and go straight to the duration.
      label.addEventListener("keydown", event => {
        if (event.key === "Escape") {
          event.preventDefault();
          command.focus();
          command.select();
        }
      });

      function commitInput() {
        if (endedAt !== null) return;
        if (isCountUpCommand(command.value)) {
          startFromInput();
          return;
        }

        const seconds = parseCommand(command.value);
        if (seconds === null || seconds <= 0) {
          command.focus();
          command.select();
          updateInputAssist();
          return;
        }
        startFromInput();
      }

      command.addEventListener("keydown", event => {
        if (event.key === "Enter") {
          event.preventDefault();
          commitInput();
        }
      });

      enterChip.addEventListener("mousedown", event => event.preventDefault());
      enterChip.addEventListener("click", commitInput);

      pauseButton.addEventListener("mousedown", event => event.preventDefault());
      pauseButton.addEventListener("click", () => {
        if (endedAt !== null) {
          reset();
        } else if (running) {
          pause();
        } else {
          start();
        }
      });

      removeButton.addEventListener("mousedown", event => event.preventDefault());
      removeButton.addEventListener("click", () => {
        if (timer.classList.contains("empty") && !label.value.trim()) return;
        clearTimeout(timerId);

        if (timerList.children.length === 1) {
          running = false;
          timer.classList.remove("running", "paused", "counting-up");
          countingUp = false;
          endedAt = null;
          initialSeconds = 0;
          deadline = 0;
          timerId = null;
          remainingSeconds = 0;
          hasStarted = false;
          disposableIfEmpty = true;

          timer.classList.add("empty", "landing");
          label.value = "";
          command.readOnly = false;
          command.value = "";
          updateInputAssist();
          updateDeleteButtons();
          persistTimerState();

          requestAnimationFrame(() => command.focus());
          return;
        }

        timer.remove();
        updateDeleteButtons();
        persistTimerState();
      });

      timerList.appendChild(timer);
      render();

      if (blank) {
        command.value = "";
        tinySummary.textContent = "untitled —";
        updateInputAssist();
      }

      updateDeleteButtons();
      if (autoStart) start();

      return timer;
    }

    function getDraftTimer() {
      return timerList.querySelector(".timer-unit.empty");
    }

    function persistTimerState() {
      if (!window.timerWindow) return;

      const timers = [...timerList.querySelectorAll(".timer-unit")]
        .map(timer => timer.timerState.snapshot());
      const hasRunningTimer = timers.some(timer => timer.running);

      window.timerWindow.saveTimerState(hasRunningTimer ? { timers } : null);
    }

    function syncAddButton() {
      addButton.hidden = false;
    }

    function updateDeleteButtons() {
      timerList.querySelectorAll(".timer-unit").forEach(timer => {
        const button = timer.querySelector(".remove");
        const hasLabel = Boolean(timer.querySelector(".timer-label").value.trim());
        button.hidden = timer.classList.contains("empty") && !hasLabel;
      });

      syncAddButton();
      syncWindowSize();
    }

    function syncWindowSize({ animate = false, force = false } = {}) {
      if (!window.timerWindow || (modeTransition && !force)) return;

      const shellStyle = getComputedStyle(shell);
      const paddingTop = parseFloat(shellStyle.paddingTop) || 0;
      const paddingBottom = parseFloat(shellStyle.paddingBottom) || 0;

      const timerUnits = timerList.querySelectorAll(".timer-unit");
      let listContentHeight;
      if (tinyMode) {
        // Tiny summaries wrap onto additional lines as the user narrows the
        // window, so measure the laid-out list instead of treating every
        // timer as though it occupies a single vertical row.
        listContentHeight = timerList.getBoundingClientRect().height;
      } else {
        let timersHeight = 0;
        timerUnits.forEach(unit => {
          const style = getComputedStyle(unit);
          timersHeight += force
            ? Math.max(parseFloat(style.minHeight) || 0, parseFloat(style.flexBasis) || 0)
            : unit.offsetHeight;
        });

        const listStyle = getComputedStyle(timerList);
        const gap = parseFloat(listStyle.gap) || 0;
        const totalGap = timerUnits.length > 1 ? (timerUnits.length - 1) * gap : 0;
        const listPaddingY = (parseFloat(listStyle.paddingTop) || 0) + (parseFloat(listStyle.paddingBottom) || 0);
        listContentHeight = listPaddingY + timersHeight + totalGap;
      }

      const actionsHeight = timerActions.getBoundingClientRect().height;
      const actionsStyle = getComputedStyle(timerActions);
      const actionsMarginY = (parseFloat(actionsStyle.marginTop) || 0) + (parseFloat(actionsStyle.marginBottom) || 0);

      let totalContentHeight = paddingTop + paddingBottom + listContentHeight
        + (tinyMode ? 0 : actionsHeight + actionsMarginY);
      if (!tinyMode && force) totalContentHeight = Math.max(totalContentHeight, fullModeHeight || 0);

      return window.timerWindow.resizeToContent(
        totalContentHeight,
        animate,
        tinyMode || force ? "bottom-left" : "top-left"
      );
    }

    window.addEventListener("resize", () => {
      // Height changes during our own animation must not start another resize.
      const widthChanged = window.innerWidth !== lastWindowWidth;
      lastWindowWidth = window.innerWidth;
      if (!widthChanged || modeTransition || !tinyMode || tinyResizeFrame !== null) return;
      tinyResizeFrame = requestAnimationFrame(() => {
        tinyResizeFrame = null;
        syncWindowSize();
      });
    });

    function setInputsForTinyMode(enabled) {
      timerList.querySelectorAll(".timer-unit").forEach(timer => {
        const label = timer.querySelector(".timer-label");
        const command = timer.querySelector(".command");
        const remove = timer.querySelector(".remove");

        label.readOnly = enabled;
        label.tabIndex = enabled ? -1 : 0;
        command.readOnly = enabled || timer.timerState.isRunning();
        command.tabIndex = enabled ? -1 : 0;
        remove.tabIndex = enabled ? -1 : 0;
        timer.tabIndex = enabled ? 0 : -1;
      });
    }

    async function changeTinyMode(enabled, selectedTimer) {
      if (modeTransition || tinyMode === enabled) return;
      modeTransition = true;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      let outgoing;
      try {
        if (enabled) {
          fullModeHeight = window.innerHeight;
          fullModeScroll = timerList.scrollTop;
        }
        // Hide the layout handoff; reveal it after the window reaches its size.
        outgoing = shell.animate([{ opacity: 1 }, { opacity: 0 }], {
          duration: reducedMotion ? 0 : (enabled ? 70 : 25), fill: "forwards"
        });
        await outgoing.finished;
        tinyMode = enabled;
        shell.classList.toggle("tiny-mode", enabled);
        setInputsForTinyMode(enabled);
        tinyModeButton.setAttribute("aria-pressed", String(enabled));
        tinyModeButton.setAttribute("aria-label", enabled ? "Exit tiny mode" : "Enter tiny mode");
        tinyModeButton.title = enabled ? "Expand" : "Shrink";
        document.activeElement?.blur();
        await new Promise(requestAnimationFrame);
        await syncWindowSize({ animate: !reducedMotion, force: true });
        if (!enabled) {
          timerList.scrollTop = fullModeScroll;
          selectedTimer?.scrollIntoView({ behavior: "instant", block: "nearest" });
          selectedTimer?.focus({ preventScroll: true });
        }
        outgoing.cancel();
        const incoming = shell.animate([{ opacity: 0 }, { opacity: 1 }], {
          duration: reducedMotion ? 0 : (enabled ? 110 : 45)
        });
        await incoming.finished;
      } finally {
        outgoing?.cancel();
        modeTransition = false;
      }
    }

    function enterTinyMode() {
      return changeTinyMode(true);
    }

    function leaveTinyMode(selectedTimer) {
      return changeTinyMode(false, selectedTimer);
    }

    function dismissMergeUndo() {
      clearInterval(mergeUndoTimer);
      mergeUndoTimer = null;
      pendingMergeUndo = null;
      if (mergeUndoBanner.contains(document.activeElement)) addButton.focus();
      mergeUndoBanner.hidden = true;
    }

    function startMergeUndo(source, target, sourceState, targetState, sourceNext) {
      dismissMergeUndo();
      pendingMergeUndo = { source, target, sourceState, targetState, sourceNext, expires: Date.now() + 30000 };
      const refresh = () => {
        const seconds = Math.ceil((pendingMergeUndo.expires - Date.now()) / 1000);
        if (seconds <= 0 || !target.isConnected) {
          dismissMergeUndo();
          return;
        }
        mergeUndoCountdown.textContent = `${seconds}s`;
      };
      mergeUndoBanner.hidden = false;
      refresh();
      if (pendingMergeUndo) mergeUndoTimer = setInterval(refresh, 250);
    }

    function undoMerge() {
      const undo = pendingMergeUndo;
      if (!undo || Date.now() >= undo.expires || !undo.target.isConnected) {
        dismissMergeUndo();
        return;
      }
      dismissMergeUndo();
      const { source, target, sourceState, targetState, sourceNext } = undo;
      target.timerState.pause();
      target.timerState.restore(targetState);
      timerList.insertBefore(source, sourceNext?.isConnected ? sourceNext : null);
      source.timerState.restore(sourceState);
      setInputsForTinyMode(tinyMode);
      updateDeleteButtons();
      persistTimerState();
      if (!tinyMode) target.querySelector(".timer-label").focus();
    }

    mergeUndoButton.addEventListener("click", undoMerge);
    mergeUndoDismiss.addEventListener("click", dismissMergeUndo);

    function closeMergeDialog() {
      clearInterval(mergeRefreshTimer);
      mergeRefreshTimer = null;
      mergeDialog.hidden = true;
      mergeRequest = null;
    }

    function requestMerge(source, target) {
      const now = Date.now();
      const sourceSeconds = source.timerState.currentSeconds(now);
      const targetSeconds = target.timerState.currentSeconds(now);

      if (!sourceSeconds || !targetSeconds || source === target) return;

      closeMergeDialog();
      mergeRequest = { source, target };
      const refresh = () => {
        const now = Date.now();
        const sourceSeconds = source.timerState.currentSeconds(now);
        const targetSeconds = target.timerState.currentSeconds(now);
        mergeMessage.textContent = `Merge ${formatTime(sourceSeconds, showSeconds)} into ${formatTime(targetSeconds, showSeconds)}?`;
      };
      refresh();
      mergeRefreshTimer = setInterval(refresh, 1000);
      mergeDialog.hidden = false;
      mergeDialog.querySelector('[data-merge-action="add"]').focus();
    }

    mergeDialog.addEventListener("click", event => {
      if (event.target === mergeDialog) closeMergeDialog();

      const action = event.target.dataset.mergeAction;
      if (!action || !mergeRequest) return;

      const { source, target } = mergeRequest;
      closeMergeDialog();
      if (action === "cancel" || !source.isConnected || !target.isConnected) return;
      if (action !== "add" && action !== "subtract") return;

      const targetWasRunning = target.timerState.isRunning();
      const now = Date.now();
      const sourceState = source.timerState.snapshot(now);
      const targetState = target.timerState.snapshot(now);
      const sourceNext = source.nextSibling;
      const merged = mergeTimerValues(sourceState, targetState, action);

      source.timerState.pause();
      target.timerState.setMergedSeconds(merged.seconds, targetWasRunning, merged.label);
      source.timerState.destroy();
      startMergeUndo(source, target, sourceState, targetState, sourceNext);
      updateDeleteButtons();
      persistTimerState();
    });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !mergeDialog.hidden) closeMergeDialog();
    });

    document.addEventListener("keydown", event => {
      if (event.key !== "Tab" || event.altKey || event.ctrlKey || event.metaKey) return;
      const cards = [...timerList.querySelectorAll(".timer-unit")];
      const candidates = !mergeDialog.hidden
        ? [...mergeDialog.querySelectorAll("button")]
        : tinyMode
          ? [...cards, tinyModeButton]
          : [
            ...cards.flatMap(card => [...card.querySelectorAll(".timer-label, .command")]),
            addButton, clockToggleButton, ...themeSwatches.toReversed(), secondsToggleButton, tinyModeButton,
            mergeUndoButton, mergeUndoDismiss,
            ...cards.flatMap(card => [...card.querySelectorAll("button")].reverse())
          ];
      const targets = candidates.filter(element => !element.disabled && element.tabIndex >= 0 && element.getClientRects().length);
      if (!targets.length) return;
      const index = targets.indexOf(document.activeElement);
      const next = index === -1 ? (event.shiftKey ? targets.length - 1 : 0)
        : (index + (event.shiftKey ? -1 : 1) + targets.length) % targets.length;
      event.preventDefault();
      targets[next].focus();
    });

    function clearDropHints() {
      timerList.querySelectorAll(".drop-target, .drop-before, .drop-after").forEach(timer => {
        timer.classList.remove("drop-target", "drop-before", "drop-after");
      });
    }

    function insertionPoint(clientY, source) {
      const timers = [...timerList.querySelectorAll(".timer-unit")]
        .filter(timer => timer !== source && !timer.classList.contains("empty"));
      const before = timers.find(timer => {
        const rect = timer.getBoundingClientRect();
        return clientY < rect.top + rect.height / 2;
      });

      return before || getDraftTimer();
    }

    function dropIntent(event, source) {
      const target = event.target.closest(".timer-unit");

      // The middle of a timer is reserved for the existing add/subtract
      // action. Its outer quarters are reorder zones, so a timer can be
      // placed naturally between its neighbours.
      if (target && target !== source && !target.classList.contains("empty")) {
        const rect = target.getBoundingClientRect();
        const relativeY = (event.clientY - rect.top) / rect.height;

        if (relativeY > 0.25 && relativeY < 0.75) {
          return { type: "merge", target };
        }

        return {
          type: "insert",
          before: relativeY <= 0.5 ? target : target.nextElementSibling,
          indicator: target,
          indicatorPosition: relativeY <= 0.5 ? "before" : "after"
        };
      }

      if (target === source) return null;

      const before = insertionPoint(event.clientY, source);
      const timers = [...timerList.querySelectorAll(".timer-unit")]
        .filter(timer => timer !== source && !timer.classList.contains("empty"));
      const previous = before
        ? before.previousElementSibling
        : timers[timers.length - 1];

      return {
        type: "insert",
        before,
        indicator: before || previous,
        indicatorPosition: before ? "before" : "after"
      };
    }

    function showDropIntent(intent) {
      clearDropHints();
      if (!intent) return;

      if (intent.type === "merge") {
        intent.target.classList.add("drop-target");
      } else if (intent.indicator) {
        intent.indicator.classList.add(intent.indicatorPosition === "before" ? "drop-before" : "drop-after");
      }
    }

    function moveTimerIntoPlace(source, before, dropY) {
      const positions = new Map(
        [...timerList.querySelectorAll(".timer-unit")]
          .map(timer => [timer, timer.getBoundingClientRect()])
      );

      timerList.insertBefore(source, before);

      const sourceRect = source.getBoundingClientRect();
      const sourceOffsetY = Math.max(
        -sourceRect.height,
        Math.min(sourceRect.height, dropY - (sourceRect.top + sourceRect.height / 2))
      );
      source.animate(
        [
          { transform: `translateY(${sourceOffsetY}px)` },
          { transform: "translateY(0)" }
        ],
        { duration: 240, easing: "cubic-bezier(0.2, 0.8, 0.2, 1)" }
      );

      timerList.querySelectorAll(".timer-unit").forEach(timer => {
        // The dragged card has its own cursor-to-slot arrival above. These
        // cards only need the smaller push created by that arrival.
        if (timer === source) return;

        const previous = positions.get(timer);
        if (!previous) return;

        const deltaY = previous.top - timer.getBoundingClientRect().top;
        if (!deltaY) return;
        const pushY = deltaY * 0.22;

        timer.animate(
          [
            { transform: `translateY(${pushY}px) scaleY(0.98)` },
            { transform: "translateY(0)" }
          ],
          { duration: 140, easing: "linear" }
        );
      });
    }

    let draggedTimer = null;
    timerList.addEventListener("dragstart", event => {
      const source = event.target.closest(".timer-unit");
      if (!source || source.classList.contains("empty") || !source.timerState.currentSeconds()) {
        event.preventDefault();
        return;
      }

      event.dataTransfer.effectAllowed = "move";
      event.dataTransfer.setData("text/plain", "timer");
      draggedTimer = source;
      // Let Chromium capture the intact card for the cursor's drag image
      // before revealing the paper underneath its original position.
      requestAnimationFrame(() => {
        if (draggedTimer === source && source.isConnected) source.classList.add("dragging");
      });
    });

    timerList.addEventListener("dragend", event => {
      draggedTimer = null;
      event.target.closest(".timer-unit")?.classList.remove("dragging");
      clearDropHints();
    });

    timerList.addEventListener("dragover", event => {
      const source = timerList.querySelector(".dragging");
      if (!source) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
      showDropIntent(dropIntent(event, source));
    });

    timerList.addEventListener("dragleave", event => {
      if (!timerList.contains(event.relatedTarget)) clearDropHints();
    });

    timerList.addEventListener("drop", event => {
      draggedTimer = null;
      const source = timerList.querySelector(".dragging");
      if (!source) return;
      event.preventDefault();
      source.classList.remove("dragging");
      const intent = dropIntent(event, source);
      clearDropHints();

      if (!intent) return;
      if (intent.type === "merge") {
        requestMerge(source, intent.target);
        return;
      }

      // Keep a blank draft at the bottom while moving completed timers.
      const before = intent.before || getDraftTimer();
      if (before !== source) moveTimerIntoPlace(source, before, event.clientY);
      updateDeleteButtons();
    });

    async function initializeTimers() {
      let savedState;
      try { savedState = await window.timerWindow?.loadTimerState(); } catch { }
      const savedTimers = savedState?.timers;

      if (Array.isArray(savedTimers) && savedTimers.length) {
        savedTimers.forEach(state => {
          const timer = addTimer();
          timer.timerState.restore(state);
        });
        updateDeleteButtons();
        return;
      }

      const landingTimer = addTimer(0, false, true, true);
      const landingLabel = landingTimer.querySelector(".timer-label");
      requestAnimationFrame(() => landingLabel.focus());
    }

    initializeTimers().catch(console.error);
    window.addEventListener("beforeunload", persistTimerState);

    tinyModeButton.addEventListener("click", () => {
      if (tinyMode) {
        leaveTinyMode();
      } else {
        enterTinyMode();
      }
    });

    function syncSecondsToggle() {
      secondsToggleButton.setAttribute("aria-checked", String(showSeconds));
    }

    function renderClock() {
      const now = new Date();
      clockTime.textContent = now.toLocaleTimeString([], {
        hour: "numeric", minute: "2-digit",
        ...(typeof clockHour12 === "boolean" ? { hour12: clockHour12 } : {}),
        ...(showSeconds ? { second: "2-digit" } : {})
      }).toLocaleLowerCase();
      clockTime.dateTime = now.toISOString();
    }

    async function refreshClockFormat() {
      try { clockHour12 = await window.timerWindow?.getClockHour12(); } catch { }
      if (clockToggleButton.getAttribute("aria-checked") === "true") renderClock();
    }

    window.addEventListener("focus", refreshClockFormat);

    function setClockVisible(visible) {
      clearInterval(clockRefreshTimer);
      clockRefreshTimer = null;
      clockPanel.hidden = false;
      clockTime.hidden = !visible;
      clockPanel.querySelector(".clock-off").hidden = visible;
      clockPanel.setAttribute("aria-label", visible ? "Current time" : "Clock hidden");
      clockToggleButton.setAttribute("aria-checked", String(visible));
      if (visible) {
        renderClock();
        refreshClockFormat();
        clockRefreshTimer = setInterval(renderClock, 250);
      }
      try { localStorage.setItem("clockEnabled", String(visible)); } catch { }
      syncWindowSize();
    }

    clockToggleButton.addEventListener("click", () => setClockVisible(clockToggleButton.getAttribute("aria-checked") !== "true"));
    let showClock = true;
    try { showClock = localStorage.getItem("clockEnabled") !== "false"; } catch { }
    setClockVisible(showClock);

    secondsToggleButton.addEventListener("click", () => {
      showSeconds = !showSeconds;
      try {
        localStorage.setItem("showSeconds", String(showSeconds));
      } catch { }
      syncSecondsToggle();
      if (clockToggleButton.getAttribute("aria-checked") === "true") renderClock();
      timerList.querySelectorAll(".timer-unit").forEach(timer => timer.timerState.render());
    });

    syncSecondsToggle();

    document.addEventListener("keydown", event => {
      if (tinyMode && event.key === "Escape") {
        event.preventDefault();
        leaveTinyMode();
      }
    });

    addButton.addEventListener("click", () => {
      const existingEmpty = getDraftTimer();

      if (existingEmpty) {
        const label = existingEmpty.querySelector(".timer-label");
        existingEmpty.scrollIntoView({behavior: "smooth", block: "nearest"});
        requestAnimationFrame(() => label.focus());
        return;
      }

      const timer = addTimer(0, false, true, false);
      const label = timer.querySelector(".timer-label");

      timer.scrollIntoView({behavior: "smooth", block: "nearest"});
      requestAnimationFrame(() => label.focus());
    });
  </script>
</body>

</html>
